[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bokete"
version = "0.1.0"
description = "Minimal PyTorch training helpers: training loop, metric tracking, loss curves, and Markdown report generation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jun Hao Chai" }
]
requires-python = ">=3.10"
keywords = ["pytorch", "deep-learning", "training-loop", "early-stopping", "metrics", "experimentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "matplotlib",
    "tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bokete"]

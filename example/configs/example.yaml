experiment_name: "mnist_mlp_demo"
seed: 42
trials: 3

# Optional: Uncomment param_grid to run a multi-config hyperparameter sweep
param_grid:
  training.lr: [0.001, 0.0005]
  model.hidden_dim: [64, 128]

data:
  batch_size: 64
  val_batch_size: 1000

model:
  hidden_dim: 128
  num_classes: 10

training:
  epochs: 5
  lr: 0.001
  optimizer: "Adam"
  loss: "CrossEntropyLoss"
  patience: 3
